test_empresa_nombre_vigente_y_miembros_reservados:
  model: modelo.empresa
  description: A company keeps the name of its most recent award; UTEs are flagged; a winner links to the BORME company that one of its names (any of them, normalized) points to, UTEs never do; the placeholder rows exist.
  inputs:
    stage.winning_party:
      rows:
        - {entry_id: e1, empresa_ref: B1, identifier: B1, identifier_scheme: NIF, name: Viejo SL}
        - {entry_id: e2, empresa_ref: B1, identifier: B1, identifier_scheme: NIF, name: Nuevo SL}
        - {entry_id: e2, empresa_ref: U1, identifier: U1, identifier_scheme: UTE, name: UTE Obras}
    stage.contract_folder_status:
      rows:
        - {entry_id: e1, updated: '2024-01-01 00:00:00+00'}
        - {entry_id: e2, updated: '2025-01-01 00:00:00+00'}
    stage.codice_code:
      rows:
        - {list: country_code, code: ES, description: España}
    # Only read by the key audits.
    modelo.sociedad: {rows: [{sociedad_key: -1}]}
    stage.sociedad_nombre:
      rows:
        - {sociedad_ref: 'hoja:M 1', nombre_normalizado: VIEJO SL}
        - {sociedad_ref: 'hoja:M 9', nombre_normalizado: UTE OBRAS}
  outputs:
    query:
      partial: true
      # Sorted by key: placeholder rows first, then md5-derived keys.
      rows:
        - {empresa_key: -1, referencia: __no_aplica__, nombre: Sin adjudicatario, es_ute: null, sociedad_key: -1}
        - {empresa_key: 0, referencia: __desconocida__, nombre: Empresa desconocida, es_ute: null, sociedad_key: -1}
        - {empresa_key: 1086721481743407, referencia: U1, nombre: UTE Obras, es_ute: true, sociedad_key: -1}
        # Linked through its older name "Viejo SL".
        - {empresa_key: 3369943935712938, referencia: B1, nombre: Nuevo SL, es_ute: false, sociedad_key: 1838055495388572}
