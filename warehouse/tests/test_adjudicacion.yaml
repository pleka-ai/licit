test_adjudicacion_reparte_importe_entre_adjudicatarios:
  model: modelo.adjudicacion
  description: Two winners share one result, a deserted lot gets the 'sin adjudicatario' member, and lot budgets come from the lot.
  inputs:
    # Dimensions are only read by the referential-integrity audits.
    modelo.empresa: {rows: [{empresa_key: -1}]}
    modelo.organo: {rows: [{organo_key: 0}]}
    modelo.resultado: {rows: [{resultado_key: 0}]}
    modelo.cpv: {rows: [{cpv_key: 0}]}
    modelo.lugar: {rows: [{lugar_key: 0}]}
    modelo.modalidad: {rows: [{modalidad_key: 0}]}
    stage.expediente_claves:
      rows:
        - {licitacion_key: 1, entry_id: e1, fecha_publicacion: '2025-01-10 00:00:00+00', organo_key: 7, modalidad_key: 8, estado_key: 9, cpv_key: 10, cpv_code: '45000000', lugar_key: 11, tax_exclusive_amount: 1000.0, total_amount: 1210.0}
    stage.tender_result:
      rows:
        - {licitacion_key: 1, entry_id: e1, n: 1, lot_number: '1', result_code: '8', award_date: '2025-03-01', awarded_tax_exclusive_amount: 600.0, awarded_payable_amount: 726.0, received_tender_quantity: 4}
        - {licitacion_key: 1, entry_id: e1, n: 2, lot_number: '2', result_code: '3'}
    stage.winning_party:
      rows:
        - {licitacion_key: 1, entry_id: e1, result_n: 1, n: 1, empresa_ref: B1, name: Uno}
        - {licitacion_key: 1, entry_id: e1, result_n: 1, n: 2, empresa_ref: B2, name: Dos}
    stage.contract:
      rows:
        - {licitacion_key: 1, entry_id: e1, result_n: 1, contract_number: C-1, issue_date: '2025-03-15'}
    stage.procurement_project_lot:
      rows:
        - {licitacion_key: 1, entry_id: e1, lot_number: '1', tax_exclusive_amount: 700.0}
        - {licitacion_key: 1, entry_id: e1, lot_number: '2', tax_exclusive_amount: 300.0}
    stage.cpv_classification:
      rows:
        - {licitacion_key: 1, entry_id: e1, n: 1, lot_number: null, cpv_code: '45000000'}
  outputs:
    query:
      partial: true
      rows:
        # Keys are deterministic: md5('empresa|<NIF>') shifted to a positive BIGINT.
        - {resultado_n: 1, adjudicatario_n: 1, empresa_key: 6901645180340097599, lote_numero: '1', peso: 0.5, importe_sin_iva: 300.0, presupuesto_sin_iva: 350.0, numero_contrato: C-1, fecha_formalizacion: '2025-03-15', num_ofertas: 4, organo_key: 7, cpv_key: 10}
        - {resultado_n: 1, adjudicatario_n: 2, empresa_key: 3066884848759454533, lote_numero: '1', peso: 0.5, importe_sin_iva: 300.0, presupuesto_sin_iva: 350.0, numero_contrato: C-1, fecha_formalizacion: '2025-03-15', num_ofertas: 4, organo_key: 7, cpv_key: 10}
        - {resultado_n: 2, adjudicatario_n: 0, lote_numero: '2', empresa_key: -1, peso: 1.0, importe_sin_iva: null, presupuesto_sin_iva: 300.0, numero_contrato: null, fecha_formalizacion: null, num_ofertas: null, organo_key: 7, cpv_key: 10}
