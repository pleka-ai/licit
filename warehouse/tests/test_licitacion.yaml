test_licitacion_entidad:
  model: modelo.licitacion
  description: The licitacion table keeps the public id formula (md5('licitacion:' || entry_id)) and resolves CODICE codes to labels, falling back to the code.
  inputs:
    stage.contract_folder_status:
      rows:
        - {licitacion_key: 1, entry_id: e1, contract_folder_id: EXP-1, name: Obra, title: Título ATOM, feed_type: insiders, status_code: PUB, type_code: '3', procedure_code: '999', funding_program_code: EU}
    stage.codice_code:
      rows:
        - {list: type_code, code: '3', description: Obras}
        - {list: status_code, code: PUB, description: EN PLAZO}
  outputs:
    query:
      partial: true
      rows:
        - id: a4c8e5bb-b434-6be6-2c37-c4b26c8cd284
          expediente: EXP-1
          titulo: Obra
          plataforma: Perfil alojado en PLACSP
          estado: EN PLAZO
          tipo_contrato: Obras
          procedimiento: '999'
          financiacion_ue: true
