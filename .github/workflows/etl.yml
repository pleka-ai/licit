name: ETL

# Daily PLACSP ingestion on an ephemeral Postgres. State (pg_dump of the
# rolling window) lives in R2; outputs are Parquet on R2 and basic rows on D1.
#
# Modes (workflow_dispatch):
#   diario    — restore state, read live feeds, prune, publish (default/cron)
#   semilla   — restore state, ingest yearly archives for `anios`, publish
#   historico — fresh DB, ingest ONE archived year, publish frozen Parquet only

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [diario, semilla, historico]
        default: diario
      anios:
        description: "Años (semilla: varios separados por espacio; historico: uno)"
        type: string
        default: ""

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: licit
          POSTGRES_USER: licit
          POSTGRES_PASSWORD: licit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODO: ${{ inputs.modo || 'diario' }}
      ANIOS: ${{ inputs.anios }}
      DATABASE_URL: postgresql://licit:licit@localhost:5432/licit
      ENVIRONMENT: ci
      PYTHONPATH: src
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: s3://licit-data
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          case "$MODO" in
            semilla) [ -n "$ANIOS" ] || { echo "semilla requiere anios"; exit 1; } ;;
            historico) echo "$ANIOS" | grep -Eq '^[0-9]{4}$' || { echo "historico requiere un solo año"; exit 1; } ;;
          esac

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.12 && uv sync --frozen

      - name: Install Postgres client
        run: sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Restore state from R2
        if: env.MODO != 'historico'
        run: |
          if aws s3 cp "$BUCKET/state/licit.dump" state.dump --only-show-errors; then
            pg_restore --no-owner --no-privileges -d "$DATABASE_URL" state.dump
            rm state.dump
          else
            echo "No previous state: starting from an empty database"
          fi

      - name: Apply schema
        run: ./schema/apply.sh "$DATABASE_URL"

      - name: Ingest
        run: |
          case "$MODO" in
            diario)
              uv run python -m etl.handlers.feed_reader
              uv run python -m etl.handlers.catalog_updater ;;
            *)
              uv run python -m etl.handlers.feed_reader --seed --years $ANIOS ;;
          esac

      - name: Prune to rolling window
        if: env.MODO != 'historico'
        run: uv run python -m export.prune

      - name: Publish Parquet
        run: |
          if [ "$MODO" = historico ]; then
            uv run python -m export.parquet "out/historico/$ANIOS"
            aws s3 cp "out/historico/$ANIOS" "$BUCKET/parquet/historico/$ANIOS/" --recursive --only-show-errors
          else
            uv run python -m export.parquet out/reciente
            aws s3 cp out/reciente "$BUCKET/parquet/reciente/" --recursive --only-show-errors
          fi

      - name: Sync D1
        if: env.MODO != 'historico'
        run: |
          npx --yes wrangler@4 d1 execute licit --remote --yes --file worker/schema.sql
          uv run python -m export.d1 build out/d1.sql out/d1.json
          npx --yes wrangler@4 d1 execute licit --remote --yes --file out/d1.sql
          uv run python -m export.d1 commit out/d1.json

      - name: Save state to R2
        if: env.MODO != 'historico'
        run: |
          pg_dump -Fc -Z 9 --no-owner \
            --exclude-table-data=api_user --exclude-table-data=api_key \
            --exclude-table-data=audit_log \
            -d "$DATABASE_URL" -f state.dump
          ls -lh state.dump
          aws s3 cp state.dump "$BUCKET/state/licit.dump" --only-show-errors
