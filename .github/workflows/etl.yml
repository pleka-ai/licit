name: ETL

# Daily PLACSP ingestion on an ephemeral Postgres. State (pg_dump of the
# rolling window) lives in R2. The parser's tables are exported as raw Parquet,
# merged into the raw history, and the data model (warehouse/, SQLMesh)
# is rebuilt from it and published to R2 (explorer) and D1 (API).
# Archived years (2017+) are loaded by historico.yml.
#
# Each stage leaves its output in R2, so a failure is retried from there:
#   diario   — restore state, read live feeds, prune, export, publish (cron)
#   semilla  — restore state, ingest yearly archives for `anios`, export, publish
#   publicar — no Postgres: rebuild the model from parquet/raw/todo and sync D1
#
# The pipeline steps are scripts (scripts/modelo.sh, d1-sql.sh, d1-load.sh)
# that the test workflow also runs end to end.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [diario, semilla, publicar]
        default: diario
      anios:
        description: "Años para semilla, separados por espacio"
        type: string
        default: ""

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: licit
          POSTGRES_USER: licit
          POSTGRES_PASSWORD: licit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODO: ${{ inputs.modo || 'diario' }}
      ANIOS: ${{ inputs.anios }}
      DATABASE_URL: postgresql://licit:licit@localhost:5432/licit
      ENVIRONMENT: ci
      PYTHONPATH: src
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Point both at a test bucket path and database to rehearse a migration.
      BUCKET: ${{ vars.R2_BUCKET || 's3://licit-data' }}
      D1_DATABASE: ${{ vars.D1_DATABASE || 'licit-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [ "$MODO" = semilla ] && [ -z "$ANIOS" ]; then
            echo "semilla requiere anios"; exit 1
          fi

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.12 && uv sync --frozen

      # ------------------------------------------------- ingest (Postgres)

      - name: Install Postgres client
        if: env.MODO != 'publicar'
        run: sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Restore state from R2
        if: env.MODO != 'publicar'
        run: |
          if aws s3 cp "$BUCKET/state/licit.dump" state.dump --only-show-errors; then
            pg_restore --no-owner --no-privileges -d "$DATABASE_URL" state.dump
            rm state.dump
          else
            echo "No previous state: starting from an empty database"
          fi

      - name: Apply schema
        if: env.MODO != 'publicar'
        run: ./schema/apply.sh "$DATABASE_URL"

      - name: Ingest
        if: env.MODO != 'publicar'
        run: |
          # shellcheck disable=SC2086  # one argument per year
          case "$MODO" in
            diario)
              uv run python -m etl.handlers.feed_reader
              uv run python -m etl.handlers.catalog_updater ;;
            semilla)
              uv run python -m etl.handlers.feed_reader --seed --years $ANIOS ;;
          esac

      - name: Prune to rolling window
        if: env.MODO != 'publicar'
        run: uv run python -m export.prune

      - name: Export raw window
        if: env.MODO != 'publicar'
        run: |
          uv run python -m export.raw out/raw/reciente
          aws s3 cp out/raw/reciente "$BUCKET/parquet/raw/reciente/" --recursive --only-show-errors

      - name: Save state to R2
        # Right after the export: a failure while publishing keeps today's
        # ingestion, and `publicar` retries from parquet/raw.
        if: env.MODO != 'publicar'
        run: |
          pg_dump -Fc -Z 9 --no-owner -d "$DATABASE_URL" -f state.dump
          ls -lh state.dump
          aws s3 cp state.dump "$BUCKET/state/licit.dump" --only-show-errors

      # ------------------------------------------------ publish (no Postgres)

      - name: Build data model
        # todo = previous todo + today's window, so folders pruned from the
        # Postgres window are never lost. Later sources win ties.
        env:
          DATABASE_URL: ""
        run: |
          aws s3 cp "$BUCKET/parquet/raw/todo/" out/raw/todo-prev --recursive --only-show-errors
          srcs=""
          [ -f out/raw/todo-prev/contract_folder_status.parquet ] && srcs="out/raw/todo-prev"
          [ -f out/raw/reciente/contract_folder_status.parquet ] && srcs="$srcs out/raw/reciente"
          [ -n "$srcs" ] || { echo "No raw data in $BUCKET/parquet/raw"; exit 1; }
          # shellcheck disable=SC2086
          scripts/modelo.sh out/raw/todo out/modelo $srcs
          aws s3 cp out/raw/todo "$BUCKET/parquet/raw/todo/" --recursive --only-show-errors
          aws s3 cp out/modelo "$BUCKET/parquet/modelo/" --recursive --only-show-errors

      - name: Sync D1
        # state/modelo-d1 is the model D1 last received (the diff baseline);
        # it only moves after a successful load. Without it: full load.
        env:
          DATABASE_URL: ""
        run: |
          aws s3 cp "$BUCKET/state/modelo-d1/" out/modelo-d1 --recursive --only-show-errors
          scripts/d1-sql.sh out/d1 out/modelo out/modelo-d1
          scripts/d1-load.sh out/d1
          aws s3 sync out/modelo "$BUCKET/state/modelo-d1/" --delete --only-show-errors
