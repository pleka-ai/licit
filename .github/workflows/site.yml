name: Site

# Deploys the licit Worker: static site (site/) + API (worker/).

on:
  push:
    branches: [main]
    paths: [site/**, worker/**, wrangler.jsonc]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply D1 schema
        run: npx --yes wrangler@4 d1 execute licit-api --remote --yes --file worker/schema.sql
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
