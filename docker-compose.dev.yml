# Local Postgres for the ETL, with the schema and catalogs applied.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: licit
      POSTGRES_USER: licit
      POSTGRES_PASSWORD: licit
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licit"]
      interval: 5s
      timeout: 3s
      retries: 5

  schema-init:
    # Debian image: apply.sh needs bash and psql.
    image: postgres:16
    command: /schema/apply.sh
    environment:
      DATABASE_URL: postgresql://licit:licit@postgres:5432/licit
    volumes:
      - ./schema:/schema:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata_dev:
